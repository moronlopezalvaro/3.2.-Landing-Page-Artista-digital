<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <img src="assets/img/logo.svg" alt="Planeta con anillo" width="60" height="60">
        <h1>Nébula</h1>
        <nav>
            <a href="#galeria">Galería</a>
            <a href="#video">Vídeo</a>
            <a href="#">Contacto</a>
        </nav>
    </header>
    <main>
        <section>
            <figure>
                <img src="assets/img/hero.webp" alt="Ilustración estilizada de un planeta con anillos en el espacio"
                    width="1920" height="1200" loading="lazy">
                <figcaption>"Ilustración estilizada de un planeta con anillos" por <a
                        href="https://unsplash.com/es/fotos/ilustracion-estilizada-de-un-planeta-con-anillos-4T8LEtOT2XM">BoliviaInteligente
                        en Unsplash</a>, <a href="https://unsplash.com/es/licencia">Licencia Unsplash</a></figcaption>
            </figure>
            <h2>Paisajes de ciencia ficción</h2>
            <p>Soy Nébula, artista digital. Creo mundos imaginarios, planetas lejanos y cielos que nunca has visto.</p>
        </section>
        <section id="galeria">
            <h2>Galería</h2>
            <div class="galeria">
                <figure>
                    <img src="assets/img/galeria-1.webp" alt="Planeta morado con anillos violetas sobre fondo negro"
                        width="400" height="250" loading="lazy">
                    <figcaption>"Un planeta púrpura y negro" por <a
                            href="https://unsplash.com/es/fotos/un-objeto-purpura-y-negro-en-medio-de-un-fondo-negro-MaQZ6kUxNsU">BoliviaInteligente
                            en Unsplash</a>, <a href="https://unsplash.com/es/licencia">Licencia Unsplash</a>
                    </figcaption>
                </figure>
                <figure>
                    <img src="assets/img/galeria-2.webp"
                        alt="Pintura abstracta en espiral azul y blanca que recuerda a una galaxia" width="400"
                        height="250" loading="lazy">
                    <figcaption>"Azul y negro ilustración abstracta" por <a
                            href="https://unsplash.com/es/fotos/azul-y-negro-ilustracion-abstracta-hgThOxNqQq0">Pawel
                            Czerwinski en Unsplash</a>, <a href="https://unsplash.com/es/licencia">Licencia Unsplash</a>
                    </figcaption>
                </figure>
                <figure>
                    <img src="assets/img/galeria-3.webp" alt="Planeta rosa rodeado de anillos rosas y morados"
                        width="400" height="250" loading="lazy">
                    <figcaption>"Planeta rosa rodeado de anillos rosas y morados" por <a
                            href="https://unsplash.com/es/fotos/un-fondo-negro-con-circulos-rosas-y-morados-6YI0XmpZ_I8">BoliviaInteligente
                            en Unsplash</a>, <a href="https://unsplash.com/es/licencia">Licencia Unsplash</a>
                    </figcaption>
                </figure>
            </div>
        </section>
        <section id="video">
            <h2>Vídeo de presentación</h2>
            <figure>
                <video controls width="1280" height="720" poster="assets/img/miniatura.webp" preload="metadata">
                    <source src="assets/video/presentacion.mp4" type="video/mp4">
                    Tu navegador no puede reproducir este vídeo.
                </video>
                <figcaption>"Nebulosa CGI espacial" por <a
                        href="https://pixabay.com/es/videos/nebulosa-cgi-espacial-386753/">uxcsani en Pixabay</a>, <a
                        href="https://pixabay.com/es/service/license-summary/">Licencia de contenido de Pixabay</a>
                </figcaption>
            </figure>
        </section>
        <section>
            <h2>Ambiente sonoro</h2>
            <figure>
                <audio controls preload="metadata">
                    <source src="assets/audio/ambiente.mp3" type="audio/mpeg">
                    Tu navegador no puede reproducir este audio.
                </audio>
                <figcaption>"Sci-Fi Documentary" por <a
                        href="https://pixabay.com/es/music/clásico-moderno-sci-fi-documentary-262608/">leberch en
                        Pixabay</a>, <a href="https://pixabay.com/es/service/license-summary/">Licencia de contenido de
                        Pixabay</a></figcaption>
            </figure>
        </section>
        <section id="contacto">
            <h2>¿Hablamos?</h2>
            <a href="mailto:nebulart@contacto.com">
                <img src="assets/img/calltoaction.webp" alt="Botón de contacto con efecto neón" width="300" height="90"
                    loading="lazy">
            </a>
        </section>
    </main>
    <footer>
        <p>© 2026 Nébula</p>
    </footer>
</body>

</html>
